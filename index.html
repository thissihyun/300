<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>시현 & 강원 · 300 DAYS WITH YOU</title>
<meta name="theme-color" content="#f7f1e4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/app-icon-v26.svg">
<link rel="apple-touch-icon" href="assets/app-icon-v26.svg">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ================= LOCK SCREEN (Section 3) ================= -->
<div id="lockScreen">
  <div class="lock-eyebrow">FOR SIHYUN &amp; GANGWON ONLY</div>
  <div class="lock-title">Enter our date</div>
  <div class="lock-sub">300 Days With You · from New York to us</div>
  <input id="lockInput" class="lock-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
  <button id="lockBtn" class="btn">들어가기</button>
  <div id="lockErr" class="err-text"></div>
</div>

<!-- ================= IDENTITY / PIN (Section 4) ================= -->
<div id="identityScreen" style="display:none;">
  <div class="lock-eyebrow">WHO ARE YOU?</div>
  <div class="lock-title" id="identityTitle">Who are you?</div>
  <div id="identityStage"></div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="app">
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand" data-action="view" data-target="home">
        <div class="brand-names">시현 &amp; 강원</div>
        <div class="brand-tag">300 Days With You · from New York to us</div>
      </div>
      <nav class="top-nav">
        <button data-action="view" data-target="home" data-nav="home">HOME</button>
        <button data-action="view" data-target="ourdays" data-nav="ourdays">OUR DAYS</button>
        <button data-action="view" data-target="diary" data-nav="diary">DIARY</button>
        <button data-action="view" data-target="special" data-nav="special">SPECIAL</button>
        <button data-action="view" data-target="future" data-nav="future">OUR FUTURE</button>
      </nav>
      <div class="header-tools">
        <button class="user-pill" id="userPillBtn" data-action="switch-user">WRITING AS · —</button>
        <button class="icon-btn" data-action="toggle-notif" aria-label="notifications">🔔<span class="badge" id="notifBadge" style="display:none;">0</span></button>
      </div>
    </div>
  </header>

  <div class="notif-panel" id="notifPanel"></div>

  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-ourdays"></section>
    <section class="view" id="view-diary"></section>
    <section class="view" id="view-ourstory"></section>
    <section class="view" id="view-album"></section>
    <section class="view" id="view-special">
      <div id="specialHub"></div>
      <div id="specialDetailHost" style="display:none;"></div>
    </section>
    <section class="view" id="view-future"></section>
  </main>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button data-action="view" data-target="home" data-nav="home"><span class="ic">⌂</span>Home</button>
      <button data-action="view" data-target="ourdays" data-nav="ourdays"><span class="ic">▣</span>Our Days</button>
      <button data-action="view" data-target="diary" data-nav="diary"><span class="ic">✎</span>Diary</button>
      <button data-action="view" data-target="special" data-nav="special"><span class="ic">✦</span>Special</button>
      <button data-action="view" data-target="future" data-nav="future"><span class="ic">♡</span>Future</button>
    </div>
  </nav>

  <button class="music-fab" id="musicToggle" aria-label="music">♪</button>
  <div class="toast-host" id="toastHost"></div>
  <audio id="bgm" src="assets/audio/bgm.mp3" loop preload="none"></audio>
</div>

<!-- ================= MEMORY DETAIL MODAL (Section 23) ================= -->
<div class="modal-backdrop" id="memoryModal">
  <div class="modal-panel" id="memoryPanel"></div>
</div>

<!-- ================= PHOTO UPLOAD (Section 30/31) ================= -->
<div class="modal-backdrop" id="uploadModal">
  <div class="modal-panel" id="uploadPanel"></div>
</div>

<!-- ================= LIGHTBOX (Section 42) ================= -->
<div class="modal-backdrop" id="lightboxModal">
  <div class="modal-panel">
    <button class="icon-btn" data-action="close-modal" style="position:absolute; top:16px; right:16px; z-index:2;">✕</button>
    <img id="lightboxImg" src="" alt="">
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/data.js"></script>
<script src="js/firebase.js"></script>
<script src="js/store.js"></script>
<script src="js/router.js"></script>

<script src="js/views/home.js"></script>
<script src="js/views/ourdays.js"></script>
<script src="js/views/diary.js"></script>
<script src="js/views/memory.js"></script>
<script src="js/views/ourstory.js"></script>
<script src="js/views/album.js"></script>
<script src="js/views/special.js"></script>
<script src="js/views/future.js"></script>
<script src="js/views/notifications.js"></script>

<script src="js/app.js"></script>
</body>
</html>
