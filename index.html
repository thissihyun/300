<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3ecdf">
  <meta name="description" content="시현과 강원의 private digital relationship archive">
  <title>300 DAYS WITH YOU — from New York to us</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="paper-noise" aria-hidden="true"></div>

  <section id="lock-screen" class="gate-screen" aria-labelledby="lock-title">
    <div class="gate-card lock-card">
      <span class="eyebrow">PRIVATE ARCHIVE</span>
      <h1 id="lock-title">FOR SIHYUN &amp; GANGWON ONLY</h1>
      <p>Enter our date</p>
      <form id="lock-form" class="lock-form" autocomplete="off">
        <input id="lock-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••" aria-label="우리의 날짜">
        <button type="submit" class="primary-btn">들어가기</button>
      </form>
      <p id="lock-error" class="form-error" role="status"></p>
      <small>둘만 사용하는 아카이브를 위한 간단한 접근 잠금이에요.</small>
    </div>
  </section>

  <section id="identity-gate" class="gate-screen is-hidden" aria-labelledby="identity-title">
    <div class="gate-card identity-card">
      <span class="eyebrow">300 DAYS WITH YOU</span>
      <h2 id="identity-title">Who are you?</h2>
      <p id="identity-copy">이 기기에서 기록을 남길 사람을 선택해 주세요.</p>
      <div id="identity-stage"></div>
    </div>
  </section>

  <div id="app" class="app-shell is-hidden">
    <header class="site-header">
      <button class="brand" data-action="view" data-target="home" aria-label="홈으로">
        <span class="brand-kicker">시현 &amp; 강원</span>
        <strong>300 Days With You</strong>
        <em>from New York to us</em>
      </button>
      <div class="header-actions">
        <button id="identity-pill" class="identity-pill" data-action="switch-identity" aria-label="기록 사용자 전환"></button>
        <button class="icon-btn" data-action="open-search" aria-label="추억 검색">⌕</button>
        <button class="icon-btn bell-btn" data-action="open-activity" aria-label="활동 알림">♢<span id="activity-badge" class="badge is-hidden">0</span></button>
      </div>
    </header>

    <nav class="desktop-nav" aria-label="메인 메뉴">
      <button data-action="view" data-target="home">HOME</button>
      <button data-action="view" data-target="days">OUR DAYS</button>
      <button data-action="view" data-target="diary">DIARY</button>
      <button data-action="view" data-target="special">SPECIAL</button>
      <button data-action="view" data-target="future">OUR FUTURE</button>
    </nav>

    <main id="view-root" tabindex="-1"></main>

    <nav class="mobile-nav" aria-label="모바일 메인 메뉴">
      <button data-action="view" data-target="home"><span>⌂</span>Home</button>
      <button data-action="view" data-target="days"><span>▣</span>Our Days</button>
      <button data-action="view" data-target="diary"><span>✎</span>Diary</button>
      <button data-action="view" data-target="special"><span>✦</span>Special</button>
      <button data-action="view" data-target="future"><span>♡</span>Future</button>
    </nav>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <button id="music-button" class="music-button" data-action="toggle-music" aria-label="배경 음악 재생 또는 정지">♪</button>
  <audio id="bgm" src="assets/audio/bgm.mp3" preload="none" loop></audio>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
