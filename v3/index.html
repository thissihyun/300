<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>시현 & 강원 · 300 DAYS WITH YOU · V3</title>
<meta name="theme-color" content="#f7f1e4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/app-icon-v26.svg">
<link rel="apple-touch-icon" href="../assets/app-icon-v26.svg">
<link rel="stylesheet" href="../v2/css/main.css">
<link rel="stylesheet" href="css/v3.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body>
<div class="v3-paper-noise" aria-hidden="true"></div>

<div id="lockScreen">
  <div class="lock-eyebrow">FOR SIHYUN &amp; GANGWON ONLY</div>
  <div class="lock-title">Enter our date</div>
  <div class="lock-sub">300 Days With You · from New York to us · V3</div>
  <input id="lockInput" class="lock-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
  <button id="lockBtn" class="btn">들어가기</button>
  <div id="lockErr" class="err-text"></div>
</div>

<div id="identityScreen" style="display:none;">
  <div class="lock-eyebrow">WHO ARE YOU?</div>
  <div class="lock-title" id="identityTitle">Who are you?</div>
  <div id="identityStage"></div>
</div>

<div id="app">
  <header class="masthead">
    <div class="masthead-inner">
      <div id="v3TogetherMetric" class="v3-head-metric"></div>
      <div class="brand" data-action="view" data-target="home">
        <div class="together-widget" id="togetherWidget" aria-hidden="true">
          <svg viewBox="0 0 40 26"><circle class="tw-a" cx="14" cy="13" r="8"/><circle class="tw-b" cx="26" cy="13" r="8"/></svg>
        </div>
        <div class="brand-text">
          <div class="brand-names">시현 &amp; 강원</div>
          <div class="brand-tag">300 Days With You · V3</div>
        </div>
      </div>
      <nav class="top-nav">
        <button data-action="view" data-target="home" data-nav="home">HOME</button>
        <button data-action="view" data-target="ourdays" data-nav="ourdays">OUR DAYS</button>
        <button data-action="view" data-target="diary" data-nav="diary">DIARY</button>
        <button data-action="view" data-target="special" data-nav="special">SPECIAL</button>
        <button data-action="view" data-target="future" data-nav="future">OUR FUTURE</button>
      </nav>
      <div id="v3ReunionMetric" class="v3-head-metric v3-head-metric-right"></div>
      <div class="header-tools">
        <button class="btn btn-sm btn-gold" id="installBtn" data-action="install-app" style="display:none;">홈 화면에 추가</button>
        <button class="icon-btn" data-action="open-search" aria-label="search">⌕</button>
        <button class="user-pill" id="userPillBtn" data-action="switch-user">WRITING AS · —</button>
        <button class="icon-btn" data-action="toggle-notif" aria-label="notifications">🔔<span class="badge" id="notifBadge" style="display:none;">0</span></button>
      </div>
    </div>
  </header>

  <div class="thread-divider" aria-hidden="true">
    <svg viewBox="0 0 520 22" preserveAspectRatio="none"><path d="M0,11 C120,-8 180,30 260,11 C340,-8 400,30 520,11" fill="none" stroke="#b23b3b" stroke-width="1.3" opacity="0.5"/></svg>
  </div>

  <div class="notif-panel" id="notifPanel"></div>

  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-ourdays"></section>
    <section class="view" id="view-diary"></section>
    <section class="view" id="view-ourstory"></section>
    <section class="view" id="view-album"></section>
    <section class="view" id="view-special">
      <div id="specialHub"></div>
      <div id="specialDetailHost" style="display:none;"></div>
    </section>
    <section class="view" id="view-future"></section>
  </main>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button data-action="view" data-target="home" data-nav="home"><span class="ic">⌂</span>Home</button>
      <button data-action="view" data-target="ourdays" data-nav="ourdays"><span class="ic">▣</span>Our Days</button>
      <button data-action="view" data-target="diary" data-nav="diary"><span class="ic">✎</span>Diary</button>
      <button data-action="view" data-target="special" data-nav="special"><span class="ic">✦</span>Special</button>
      <button data-action="view" data-target="future" data-nav="future"><span class="ic">♡</span>Future</button>
    </div>
  </nav>

  <button class="music-fab" id="musicToggle" aria-label="music">♪</button>
  <button class="archive-fab" id="archiveBtn" data-action="toggle-archive">
    <span class="archive-fab-ic">▥</span><span class="archive-fab-lbl">OUR<br>ARCHIVE</span>
  </button>
  <div class="toast-host" id="toastHost"></div>
  <audio id="bgm" src="../assets/audio/bgm.mp3" loop preload="none"></audio>
</div>

<div class="archive-drawer" id="archiveDrawer">
  <div class="archive-drawer-head">
    <h3>OUR ARCHIVE</h3>
    <button class="icon-btn" data-action="toggle-archive">✕</button>
  </div>
  <div class="archive-drawer-body" id="archiveDrawerBody"></div>
</div>
<div class="archive-drawer-scrim" id="archiveDrawerScrim" data-action="toggle-archive"></div>

<div class="modal-backdrop" id="memoryModal">
  <div class="modal-panel" id="memoryPanel"></div>
</div>

<div class="modal-backdrop" id="uploadModal">
  <div class="modal-panel" id="uploadPanel"></div>
</div>

<div class="modal-backdrop" id="searchModal">
  <div class="modal-panel">
    <div class="modal-top"><button class="icon-btn" data-action="close-modal">✕</button></div>
    <input class="field" id="globalSearchInput" placeholder="추억 검색 — 첫눈, MoMA, 사랑해, 부산…">
    <div id="searchResults" style="margin-top:14px;"></div>
  </div>
</div>

<div class="modal-backdrop" id="lightboxModal">
  <div class="modal-panel">
    <button class="icon-btn" data-action="close-modal" style="position:absolute; top:16px; right:16px; z-index:2;">✕</button>
    <img id="lightboxImg" src="" alt="">
  </div>
</div>

<div class="v3-reunion-popover" id="v3ReunionPopover" aria-hidden="true">
  <div class="v3-reunion-title">NEXT TIME WE MEET</div>
  <input type="date" id="v3ReunionDate">
  <div class="v3-reunion-actions">
    <button class="btn btn-sm" id="v3ReunionSave">저장</button>
    <button class="btn btn-sm btn-outline" id="v3ReunionClose">닫기</button>
  </div>
  <div class="section-note">이 날짜는 이 기기에 저장돼요.</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="../v2/js/data.js"></script>
<script src="../v2/js/fullchat.js"></script>
<script src="../v2/js/anim.js"></script>
<script src="../v2/js/kakaoparse.js"></script>
<script src="../v2/js/firebase.js"></script>
<script src="../v2/js/store.js"></script>
<script src="../v2/js/router.js"></script>

<script src="../v2/js/views/home.js"></script>
<script src="../v2/js/views/ourdays.js"></script>
<script src="../v2/js/views/diary.js"></script>
<script src="../v2/js/views/memory.js"></script>
<script src="../v2/js/views/ourstory.js"></script>
<script src="../v2/js/views/album.js"></script>
<script src="../v2/js/views/special.js"></script>
<script src="../v2/js/views/future.js"></script>
<script src="../v2/js/views/notifications.js"></script>
<script src="../v2/js/views/search.js"></script>

<script src="js/v3.js"></script>
<script src="../v2/js/app.js"></script>
</body>
</html>
